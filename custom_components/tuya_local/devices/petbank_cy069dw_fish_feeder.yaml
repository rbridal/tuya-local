name: Fish feeder
products:
  - id: xiv8det7nuchebfy
    manufacturer: Petbank
    model: CY-069DW
entities:
  - entity: switch
    icon: "mdi:fishbowl"
    dps:
      - id: 1
        type: boolean
        name: switch
  - entity: button
    name: Feed 1 portion
    icon: "mdi:fish"
    dps:
      - id: 2
        type: integer
        name: button
        mapping:
          - dps_val: 1
            value: true
  - entity: button
    name: Feed 2 portions
    icon: "mdi:fish"
    dps:
      - id: 2
        type: integer
        name: button
        mapping:
          - dps_val: 2
            value: true
  - entity: button
    name: Feed 3 portions
    icon: "mdi:fish"
    dps:
      - id: 2
        type: integer
        name: button
        mapping:
          - dps_val: 3
            value: true
  - entity: button
    name: Feed 4 portions
    icon: "mdi:fish"
    dps:
      - id: 2
        type: integer
        name: button
        mapping:
          - dps_val: 4
            value: true
  - entity: button
    name: Feed 5 portions
    icon: "mdi:fish"
    dps:
      - id: 2
        type: integer
        name: button
        mapping:
          - dps_val: 5
            value: true
  - entity: event
    name: Manual feed report
    dps:
      - id: 6
        type: integer
        optional: true
        name: event
        mapping:
          - dps_val: 0
            value: error
          - dps_val: null
            value: null
          - value: fed
      - id: 6
        type: integer
        optional: true
        name: portions
  - entity: event
    name: Auto feed report
    dps:
      - id: 7
        type: integer
        optional: true
        name: event
        mapping:
          - dps_val: 0
            value: error
          - dps_val: null
            value: null
          - value: fed
      - id: 7
        type: integer
        optional: true
        name: portions
  - entity: sensor
    class: temperature
    dps:
      - id: 103
        type: string
        name: sensor
        mapping:
          - dps_val: "----"
            value: null
      - id: 101
        type: string
        name: unit
        mapping:
          - dps_val: "F"
            value: F
          - dps_val: "C"
            value: C
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 101
        type: string
        name: option
        mapping:
          - dps_val: "F"
            value: fahrenheit
          - dps_val: "C"
            value: celsius
  - entity: number
    translation_key: minimum_temperature
    category: config
    class: temperature
    dps:
      - id: 108
        type: integer
        name: value
        unit: F
        range:
          min: 500
          max: 680
        mapping:
          - scale: 10
  - entity: number
    translation_key: maximum_temperature
    category: config
    class: temperature
    dps:
      - id: 107
        type: integer
        name: value
        unit: F
        range:
          min: 820
          max: 970
        mapping:
          - scale: 10
