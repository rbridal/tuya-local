name: Fish feeder
products:
  - id: xiv8det7nuchebfy
    manufacturer: Petbank
    model: CY-069DW
entities:
  - entity: switch
    icon: "mdi:fishbowl"
    dps:
      - id: 1
        type: boolean
        name: switch
  - entity: button
    name: Feed 1 portion
    icon: "mdi:fish"
    dps:
      - id: 2
        type: integer
        name: button
        mapping:
          - dps_val: 1
            value: true
  - entity: button
    name: Feed 2 portions
    icon: "mdi:fish"
    dps:
      - id: 2
        type: integer
        name: button
        mapping:
          - dps_val: 2
            value: true
  - entity: button
    name: Feed 3 portions
    icon: "mdi:fish"
    dps:
      - id: 2
        type: integer
        name: button
        mapping:
          - dps_val: 3
            value: true
  - entity: button
    name: Feed 4 portions
    icon: "mdi:fish"
    dps:
      - id: 2
        type: integer
        name: button
        mapping:
          - dps_val: 4
            value: true
  - entity: button
    name: Feed 5 portions
    icon: "mdi:fish"
    dps:
      - id: 2
        type: integer
        name: button
        mapping:
          - dps_val: 5
            value: true
  - entity: event
    name: Manual feed report
    dps:
      - id: 6
        type: integer
        optional: true
        name: event
        mapping:
          - dps_val: 0
            value: error
          - dps_val: null
            value: null
          - value: fed
      - id: 6
        type: integer
        optional: true
        name: portions
  - entity: event
    name: Auto feed report
    dps:
      - id: 7
        type: integer
        optional: true
        name: event
        mapping:
          - dps_val: 0
            value: error
          - dps_val: null
            value: null
          - value: fed
      - id: 7
        type: integer
        optional: true
        name: portions
  - entity: sensor
    class: temperature
    dps:
      - id: 103
        type: string
        name: sensor
        mapping:
          - dps_val: "----"
            value: null
      - id: 101
        type: string
        name: unit
        mapping:
          - dps_val: "F"
            value: F
          - dps_val: "C"
            value: C
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 101
        type: string
        name: option
        mapping:
          - dps_val: "F"
            value: fahrenheit
          - dps_val: "C"
            value: celsius
  - entity: number
    translation_key: minimum_temperature
    category: config
    class: temperature
    dps:
      - id: 108
        type: integer
        name: value
        unit: F
        range:
          min: 500
          max: 680
        mapping:
          - scale: 10
  - entity: number
    translation_key: maximum_temperature
    category: config
    class: temperature
    dps:
      - id: 107
        type: integer
        name: value
        unit: F
        range:
          min: 820
          max: 970
        mapping:
          - scale: 10
  - entity: number
    name: Low temperature alert (°C)
    category: config
    class: temperature
    icon: "mdi:thermometer-low"
    dps:
      - id: 105
        type: integer
        name: value
        unit: C
        range:
          min: 100
          max: 200
        mapping:
          - scale: 10
  - entity: number
    name: High temperature alert (°C)
    category: config
    class: temperature
    icon: "mdi:thermometer-high"
    dps:
      - id: 106
        type: integer
        name: value
        unit: C
        range:
          min: 280
          max: 360
        mapping:
          - scale: 10
  - entity: sensor
    name: Indicator color
    category: diagnostic
    dps:
      - id: 102
        type: string
        optional: true
        name: sensor
  - entity: select
    name: Feeding
    translation_key: timer
    category: config
    hidden: true
    dps:
      - id: 3
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "6h"
            value: "6h"
          - dps_val: diy
            value: custom
  - entity: number
    name: Auto feed
    category: config
    hidden: true
    icon: "mdi:fish"
    dps:
      - id: 4
        type: integer
        optional: true
        name: value
        unit: portions
        range:
          min: 0
          max: 3
  - entity: text
    translation_key: meal_plan
    category: config
    hidden: true
    dps:
      - id: 5
        type: base64
        optional: true
        name: value
